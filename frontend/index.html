<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancer AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="chat-header">
            <div class="header-info">
                <h1>🧬 Cancer AI</h1>
                <p class="subtitle">Secure, RAG-powered healthcare assistant</p>
            </div>
            <div class="status-indicator">
                <span class="dot"></span> Online
            </div>
        </header>

        <main class="chat-window" id="chat-window">
            <div class="message system">
                <div class="avatar">🧬</div>
                <div class="message-content">
                    <p>Hello! I am your Cancer Information Assistant. How can I help you today?</p>
                    <span class="disclaimer-text">I can provide general information, but I cannot diagnose or prescribe.</span>
                </div>
            </div>
        </main>

        <div class="input-container">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Ask about symptoms, treatments, prevention..." autocomplete="off" required>
                <button type="submit" id="send-btn" aria-label="Send message">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="send-icon"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
