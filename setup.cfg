[metadata]
name = cancer-awareness-chatbot
version = 1.0.0
description = RAG-based cancer awareness chatbot API (FastAPI + Groq)
python_requires = >=3.10

[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude = .venv,venv,__pycache__,.git

[mypy]
python_version = 3.10
ignore_missing_imports = True
check_untyped_defs = False
